[package]
name = "career-scout-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
dotenvy = "0.15.7"
env_logger = "0.11.10"
feed-rs = "2.3.1"
futures-util = "0.3.32"
log = "0.4.31"
md5 = "0.8.0"
regex = "1.12.3"
scraper = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.8.3", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "macros"] }
teloxide = { version = "0.17.0", default-features = false, features = ["macros", "rustls"] }
tokio = { version = "1.52.3", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = "2.5.8"
